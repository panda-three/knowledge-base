          <td><p>钟山位于南京城东，自古被誉为&ldquo;江南四大名山&rdquo;之一，有&ldquo;钟山龙蟠&rdquo;之美誉。钟山于山、水、城、林浑然一体，自然景观丰富优美，文化底蕴博大深厚，中山陵景区、明孝陵景区、灵谷景区等三大核心景区分布着各类名胜古迹200多处，其中，世界文化遗产1处、全国重点文物保护单位16处，钟山风景区荣获&ldquo;国家风景名胜区&rdquo;、&ldquo;AAAAA级旅游景区&rdquo;等称号。</p>
          <p>&ldquo;建设大美钟山，讲好钟山故事&rdquo;，&ldquo;钟山学堂&rdquo;开讲暨&ldquo;市民学堂&rdquo;城东分讲堂成立仪式，4月10日，在钟山风景区举行。&ldquo;钟山学堂&rdquo;首场讲座特邀全国政协委员、南京文化与自然遗产研究所所长贺云翱主讲《大美钟山与钟山文化》。</p></td>
